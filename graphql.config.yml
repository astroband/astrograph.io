schema: ./server/schema.graphql
documents: ./src/graphql/*.gql

extensions:
  codegen:
    generates:
      ./src/types.ts:
        plugins:
          - typescript
          - typescript-resolvers
  endpoints:
    Astrograph Pubnet:
      url: https://pubnet.astrograph.io/graphql
      headers:
        user-agent: Astrograph.io
      introspect: false
